<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Day OS</title>
<meta name="theme-color" content="#EFF1EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Day OS">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@450;500;600&family=IBM+Plex+Sans:wght@450;500;600;700&display=swap" rel="stylesheet">
<style>:root{--paper:#EFF1EC;--line:#DDE1D7;--ink:#14191A;--ink2:#2F3633;--ink3:#4E5651;
--pen:#27436F;--plum:#5D4064;--moss:#2F6B48;--clay:#A34328;--card:#FCFCFA;--edge:#D6DACE;
--meal:#B7701B;--gym:#2F6B48;--home:#1F7A73;--skin:#9A3F7A;--med:#B4322B;--study:#27436F;--rev:#5D4064;--free:#8A918B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
background-size:28px 28px;color:var(--ink);
font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;font-weight:500;
padding-bottom:96px;-webkit-text-size-adjust:100%}
.wrap{max-width:660px;margin:0 auto;padding:14px 13px 0}
h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:-.02em;font-size:26px;margin:0 0 12px}
h2{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;letter-spacing:-.01em;font-size:18px;margin:0 0 8px}
h3{font-size:15px;margin:14px 0 6px;font-weight:700}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.muted{color:var(--ink2);font-weight:500}.faint{color:var(--ink3);font-weight:500}
.sm{font-size:14px}.xs{font-size:13px}.hidden{display:none!important}
.lt{color:var(--clay)!important}.grow{flex:1}
.card{background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:15px;margin-bottom:13px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.warn{background:#FAF1ED;border-color:#E5CDC3}.ok{background:#EFF6F1;border-color:#C8DFD0}
.empty{text-align:center;padding:20px 10px;color:var(--ink2);font-size:14.5px;font-weight:500}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bigclock{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1;color:var(--pen);font-variant-numeric:tabular-nums}
.tb2{flex:1;min-width:0}.tbd{font-size:14px;font-weight:600}
.tbc{font-size:13px;color:var(--ink2);font-weight:500}.tbc b{color:var(--ink);font-weight:700}
.syncdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;background:#B9BFB8}
.syncdot.on{background:var(--moss)}.syncdot.err{background:var(--clay)}

/* banner */
.calm{background:linear-gradient(135deg,#1F3B66,#3A2F5E);color:#fff;border:0}
.calm h2{color:#fff;font-size:22px;margin-bottom:6px}
.calm p{margin:0 0 10px;font-size:15px;color:#E6EAF3;font-weight:500}
.calm b{color:#fff}
.calm .stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.calm .st{background:rgba(255,255,255,.1);border-radius:10px;padding:9px 11px}
.calm .st .k{font-size:12.5px;color:#C9D2E6;font-weight:600}
.calm .st .v{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:700;line-height:1.2}
.calm .st .s{font-size:12.5px;color:#C9D2E6}
.calm .spd button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#E6EAF3}
.calm .spd button.on{background:#fff;color:#1F3B66;border-color:#fff}
.calm .foot{font-size:13px;color:#C9D2E6;margin-top:9px}

/* speed */
.spd{display:flex;gap:5px;margin-top:8px}
.spd button{flex:1;min-width:0;border:1px solid var(--edge);background:#fff;color:var(--ink2);border-radius:8px;padding:9px 0;cursor:pointer;font-size:14px;font-family:"IBM Plex Mono",monospace;font-weight:500}
.spd button.on{background:var(--pen);border-color:var(--pen);color:#fff;font-weight:600}

/* buttons + inputs */
button{font-family:inherit;font-size:15px}
.btn{border:1px solid var(--pen);background:var(--pen);color:#fff;border-radius:10px;padding:12px 14px;cursor:pointer;font-weight:600;line-height:1.25}
.btn.quiet{background:#fff;color:var(--ink2);border-color:var(--edge)}
.btn.big{font-size:18px;padding:16px;width:100%}
.btn.wide{width:100%}.btn:disabled{opacity:.35}
.btn.off{background:#fff;color:var(--clay);border-color:#E5CDC3}
.mini{padding:5px 9px;font-size:13px;border-radius:7px}
.row2b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--edge);border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);width:100%;font-weight:500}
textarea{min-height:110px;font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.6}
label.f{display:block;margin:12px 0 5px;font-size:14px;color:var(--ink2);font-weight:500}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.link{color:var(--pen);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:13.5px;font-weight:500}
.setrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.sl{flex:1;font-size:14.5px;font-weight:500}
.si{width:132px;flex:0 0 auto;text-align:center;padding:9px 6px;font-size:14px}
pre{background:#F3F5EF;border:1px solid var(--edge);border-radius:8px;padding:10px;overflow:auto;font-size:13px;margin:9px 0}

/* today head */
.dayhead{display:flex;gap:8px;margin-bottom:12px}
.dayhead .btn{flex:1;font-size:14px;padding:11px 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;background:#fff;border:1px solid var(--edge);border-left:4px solid var(--c,var(--edge));border-radius:8px;padding:5px 10px 5px 8px;color:var(--ink)}
.chip b{font-family:"IBM Plex Mono",monospace}
.note{font-size:13.5px;color:#7A4A1A;background:#FBF3E6;border:1px solid #EBD8B8;border-radius:9px;padding:8px 11px;margin-top:9px;font-weight:500}
.water{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.wg{width:24px;height:24px;border-radius:6px;border:1.5px solid #9DB8D6;background:#fff;cursor:pointer;padding:0}
.wg.on{background:#5B8FC7;border-color:#5B8FC7}

/* timeline */
.tl{position:relative}
.blk{background:var(--card);border:1px solid var(--edge);border-left:5px solid var(--c,var(--edge));border-radius:11px;margin-bottom:9px;overflow:hidden}
.blk.past{opacity:.62}
.blk.now{box-shadow:0 0 0 2px var(--c,var(--pen));opacity:1}
.blk.done{opacity:.55}
.pf .blk.past{opacity:.45}.pf .blk.past .nm{text-decoration:line-through}
.bh{display:flex;align-items:center;gap:10px;padding:11px 12px}
.bh .nm{flex:1;min-width:0;font-weight:700;font-size:15.5px;color:var(--c,var(--ink))}
.bh .nm small{display:block;font-weight:500;font-size:12.5px;color:var(--ink3)}
.bh .dl{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink2);font-weight:600;flex:0 0 auto}
.tchip{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:#1F3B66;background:#E4EAF3;border-radius:7px;padding:4px 8px;white-space:nowrap;flex:0 0 auto;letter-spacing:-.02em}
.bb{padding:0 12px 10px}
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .tx{flex:1;min-width:0;font-size:14.5px;font-weight:500;line-height:1.35}
.task .tx small{display:block;font-size:12.5px;color:var(--ink3);font-weight:500}
.task.done .tx{color:var(--ink3);text-decoration:line-through}
.task.med .tx{font-weight:600;color:var(--med)}
.task.med.done .tx{color:var(--ink3)}
.box{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--c,var(--pen));border-radius:8px;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:0}
.box svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:.15s}
.box[aria-checked="true"]{background:var(--c,var(--moss));border-color:var(--c,var(--moss))}
.box[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.brk{display:flex;align-items:center;justify-content:center;gap:9px;padding:2px 0 10px;font-size:13.5px;color:var(--ink3);font-weight:500}
.brk .tchip{background:#EAECE6;color:#6B726C;font-weight:500}
.nowline{display:flex;align-items:center;gap:8px;margin:2px 0 9px;color:var(--clay);font-size:13px;font-weight:700}
.nowline::after{content:"";flex:1;height:2px;background:var(--clay);border-radius:2px}
.len{flex:0 0 auto;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--moss);font-weight:600}
.len s{display:block;color:#9AA09B;font-weight:500;font-size:12px}
.sub{font-size:12.5px;font-weight:600}
.cont{font-size:11.5px;font-weight:700;color:var(--plum);background:#F4EEF5;border-radius:5px;padding:0 5px;margin-left:4px}
details.more>summary{cursor:pointer;font-size:13.5px;color:var(--pen);font-weight:600;padding:7px 0;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
.exl{font-size:13.5px;color:var(--ink2);padding:3px 0}
.exl b{color:var(--ink)}
.stage{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--plum);border:1px solid #D9CBDB;background:#F7F1F8;border-radius:5px;padding:1px 6px;font-weight:500}
.qa{margin-top:7px;border-left:3px solid var(--plum);padding-left:10px}
.qarow{display:flex;gap:6px;margin-bottom:6px}
.qarow input{font-size:14px;padding:7px 9px}
.qa .q{font-size:14px;padding:7px 0;cursor:pointer;border-bottom:1px dashed var(--line);font-weight:500}
.qa .a{font-size:14px;color:var(--moss);padding:3px 0 7px;font-weight:500}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12.5px;font-weight:500}
.donebox{margin-top:6px}
.donebox summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--ink2);padding:6px 0}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(20,25,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:16px}}
.seg{display:flex;gap:6px;margin:6px 0 4px}
.seg button{flex:1;border:1px solid var(--edge);background:#fff;border-radius:9px;padding:10px 4px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--med);border-color:var(--med);color:#fff}
.ck{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;font-weight:500;cursor:pointer}
.ck input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--pen)}
.ck small{display:block;font-size:12.5px;color:var(--ink3)}

/* lists from gate app */
.row{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;word-break:break-word;line-height:1.35}
.row.done .t{color:var(--ink3);text-decoration:line-through}
.dayrow{border-top:1px solid var(--line);padding:4px 0}
.dayrow summary{padding:10px 2px;cursor:pointer;list-style:none}
.dd{font-weight:600;font-size:15px}.dn{font-size:13.5px;color:var(--ink2);margin-left:8px;font-weight:500}
.ds{font-size:13px;color:var(--ink3);margin-top:3px;font-weight:500}
.r2{display:flex;gap:10px;align-items:flex-start;padding:8px 0 8px 6px;border-top:1px solid var(--line)}
.rt{flex:1;font-size:14.5px;font-weight:500;min-width:0}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;display:inline-block;margin-top:6px}
details summary::-webkit-details-marker{display:none}
.sub2{padding:13px 0 13px 12px;border-top:1px solid var(--line);border-left:5px solid var(--sc,var(--edge));margin-bottom:2px}
.s2h{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.s2h b{font-size:16px;font-weight:700;color:var(--sc,var(--ink))}
.s2m{font-size:13.5px;color:var(--ink2);margin-top:4px;font-weight:500}
.modh{display:flex;align-items:center;gap:8px;background:#F3F5EF;border:1px solid var(--edge);border-radius:8px;padding:8px 10px;margin:11px 0 4px}
.pill{font-size:12px;border:1px solid var(--edge);border-radius:20px;padding:1px 8px;color:var(--ink2);font-weight:500}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.edt{border:0;border-bottom:1px dashed var(--edge);border-radius:0;padding:3px 0;font-size:14.5px;background:transparent;font-weight:500}
.edn{width:78px;border:1px solid var(--edge);border-radius:6px;padding:3px 6px;font-size:12.5px;font-family:"IBM Plex Mono",monospace}
.tbl{margin-top:10px;font-size:14px}
.tr{display:grid;grid-template-columns:.7fr 1fr 1fr 1fr;gap:4px;padding:9px 0;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:13px}
.tr.th{border-top:0;color:var(--ink3);font-size:12px;font-family:"IBM Plex Sans",sans-serif}
.tr.cur{background:#EDF1F7;font-weight:700}
.finrow{display:flex;align-items:center;gap:10px;padding:10px 0 10px 12px;border-top:1px solid var(--line);border-left:5px solid var(--sc)}
.fname{flex:1;font-weight:600;font-size:15px;color:var(--sc)}
.fdate{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;color:#1F3B66;background:#E4EAF3;border-radius:7px;padding:3px 9px}
.codebox{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:600;letter-spacing:.04em;text-align:center;background:#F3F5EF;border:1px dashed var(--edge);border-radius:10px;padding:12px;margin:8px 0;user-select:all}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(252,252,250,.98);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.navin{max-width:660px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{background:none;border:0;padding:11px 2px 14px;color:var(--ink3);cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav button[aria-current="true"]{color:var(--pen)}
nav .pip{width:6px;height:6px;border-radius:50%;background:transparent}
nav button[aria-current="true"] .pip{background:var(--pen)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#14191A;color:#fff;padding:9px 15px;border-radius:9px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}

@media(min-width:980px){
 .wrap{max-width:1140px;padding:18px 20px 0}
 .grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
 .grid .side{grid-column:2;grid-row:1;position:sticky;top:16px}
 .grid .main{grid-column:1;grid-row:1;min-width:0}
 .navin{max-width:1140px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.irow{display:flex;align-items:center;gap:10px;padding:7px 0 7px 9px;border-left:4px solid var(--c,var(--edge));margin:0 0 4px;font-size:14px;font-weight:600}
.irow span:last-child{min-width:0}
.nowcard{border:2px solid var(--pen)}
.nowcard .blk{margin-bottom:6px}
.nextl{margin-top:8px;font-size:13px}.nextl>b{display:block;color:var(--ink3);font-size:12.5px;margin-bottom:4px}
.mv{display:flex;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;font-weight:500}
.mv:first-of-type{border-top:0}
.mvi{width:20px;flex:0 0 auto;text-align:center;font-weight:700;color:var(--clay)}
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtabs button{flex:1;border:1px solid var(--edge);background:#fff;border-radius:10px;padding:10px 4px;font-weight:700;font-size:14.5px;color:var(--ink2);cursor:pointer}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.excard{border-top:1px solid var(--line);padding:10px 0}
.excard:first-child{border-top:0}
.exh{display:flex;align-items:baseline;gap:8px}.exh b{flex:1;font-size:15px}
.exh span{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink2)}
.setrow2{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:6px;align-items:center;margin-top:6px}
.setrow2 input{padding:7px 8px;font-size:14px;text-align:center}
.setrow2 .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink3);text-align:center}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer b{font-family:"IBM Plex Mono",monospace;font-size:22px}
.timer button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.rule{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.rule:first-of-type{border-top:0}
.rule b{display:block}
.mt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:6px 0 4px}
.mt div{background:#F3F5EF;border-radius:9px;padding:8px;text-align:center}
.mt b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:19px}
.mt span{font-size:12px;color:var(--ink3);font-weight:600}
.sumhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.sumhead .sl2{flex:1}
.sl2{font-size:14px;font-weight:600;color:var(--ink2)}
.spdbtn{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;background:var(--pen);color:#fff;border:0;border-radius:9px;padding:8px 13px;cursor:pointer}
.spdbtn span{opacity:.7;padding-left:3px}
.sumtot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
.gr{font-family:"IBM Plex Mono",monospace;color:var(--moss);font-weight:600}
.st2{font-family:"IBM Plex Mono",monospace;color:#9AA09B;text-decoration-color:#C3C9C2;font-weight:500;font-size:.9em}
.layrow{border-top:1px solid var(--line);padding:3px 0}.layrow:first-of-type{border-top:0}
.layrow>summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:10px 2px;cursor:pointer;list-style:none}
.laysp{font-family:"IBM Plex Mono",monospace;font-size:14.5px;font-weight:600;color:var(--pen);background:#E4EAF3;border-radius:7px;padding:3px 9px}
.layrow.cur .laysp{background:var(--pen);color:#fff}
.layn{font-size:14.5px;font-weight:600;white-space:nowrap}
.laycum{grid-column:1/-1;font-size:12.5px;color:var(--ink3);font-weight:500}
.layitem{display:flex;align-items:flex-start;gap:12px;padding:8px 0 8px 11px;border-left:4px solid var(--sc);margin:0 0 6px}
.li-main{flex:1;min-width:0}.lt2{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.ls2{display:block;margin-top:2px;font-size:12.5px;color:var(--sc);font-weight:600}
.durline{white-space:nowrap}

const pad = n => String(n).padStart(2, '0');
const clock = m => { m = Math.round(m); m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };

const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const D = x => new Date(x + 'T12:00:00');

const fmt2 = s => { const d = D(s); return d.getDate() + ' ' + MON[d.getMonth()]; };

const fk = k => encodeURIComponent(k).replace(/[.!'()*~]/g, c => '%' + c.charCodeAt(0).toString(16).toUpperCase());
const ufk = k => decodeURIComponent(k);
function encVal(path, v) {
  if (v == null) return null;

  return JSON.stringify(v);
}
function applyPath(T, path, v) {               // v already decoded
  const p = path.split('/');
  if (p[0] === 'core') { if (v != null) T.core = v; return; }
  if (p[0] === 'live') { if (v != null) T.live = v; return; }
  if (p[0] === 'done') { if (v == null) delete T.done[ufk(p[1])]; else T.done[ufk(p[1])] = v; return; }
  if (p[0] === 'logs' || p[0] === 'weight') { T[p[0]] = T[p[0]] || {}; if (v == null) delete T[p[0]][ufk(p[1])]; else T[p[0]][ufk(p[1])] = v; return; }
  if (p[0] === 'pos') { if (v == null) delete T.pos[ufk(p[1])]; else T.pos[ufk(p[1])] = v; return; }
  if (p[0] === 'mods') { if (v == null) delete T.mods[ufk(p[1])]; else T.mods[ufk(p[1])] = v; return; }
  if (p[0] === 'days') {
    const d = T.days[p[1]] = T.days[p[1]] || { meta: {}, ticks: {} };
    if (p[2] === 'meta') d.meta = v || {};
    else if (p[2] === 'ticks') { if (v == null) delete d.ticks[ufk(p[3])]; else d.ticks[ufk(p[3])] = v; }
  }
}
function decodePending(path, raw) { if (raw == null) return null; return typeof raw === 'string' ? JSON.parse(raw) : raw; }
function decodeRemote(v) {
  const T = { core: null, done: {}, mods: {}, pos: {}, days: {}, logs: {}, weight: {} };
  if (!v) return T;
  try { T.core = v.core ? JSON.parse(v.core) : null; } catch (e) {}
  try { if (v.live) T.live = JSON.parse(v.live); } catch (e) {}
  for (const k in (v.done || {})) try { T.done[ufk(k)] = JSON.parse(v.done[k]); } catch (e) {}
  for (const k in (v.logs || {})) try { T.logs[ufk(k)] = JSON.parse(v.logs[k]); } catch (e) {}
  for (const k in (v.weight || {})) try { T.weight[ufk(k)] = JSON.parse(v.weight[k]); } catch (e) {}
  for (const k in (v.pos || {})) try { T.pos[ufk(k)] = JSON.parse(v.pos[k]); } catch (e) {}
  for (const k in (v.mods || {})) try { T.mods[ufk(k)] = JSON.parse(v.mods[k]); } catch (e) {}
  for (const d in (v.days || {})) {
    const x = v.days[d] || {}; const o = { meta: {}, ticks: {} };
    try { o.meta = x.meta ? JSON.parse(x.meta) : {}; } catch (e) {}
    for (const t in (x.ticks || {})) o.ticks[ufk(t)] = x.ticks[t];
    T.days[d] = o;
  }
  return T;
}

  });
  if (!ideal) Object.keys(S.pos || {}).forEach(id => {
    const r = S.pos[id]; if (S.done[id] || r.d !== d || (r.at ?? -1) < s0 || r.p <= r.f) return;
    const f = findLect(id); if (!f) return;
    kept.push({ type: 'lec', mins: W(r.p - r.f), x: { s: f.s, l: f.l, rem: f.l.len - r.p }, part: { from: r.f, raw: r.p - r.f } });
  });

  if (!ideal) for (const id in S.done) { const r = S.done[id]; if (r.revd === d) { const f = findLect(id); if (f) revDone += revMins(f.l, Math.max(0, (r.stage >= 99 ? 4 : r.stage) - 1)); } }

  const pracOn = doneSubs() >= 2;
  const vidBudget = Math.max(0, studyMins - rev.mins - revDone - keptMins);
  const prac = pracOn ? Math.round(vidBudget * 0.15 / 5) * 5 : 0;
  const emDone = !ideal && Object.keys(S.done).some(id => S.done[id].d === d && (findLect(id) || {}).s && findLect(id).s.track === 'em') || kept.some(k => k.x.s.track === 'em');

  if (rev.items.length) items.push({ type: 'rev', mins: rev.mins, rev });
  kept.forEach(k => items.push(k));
  ['em', 'A', 'B', 'side'].forEach(tr => asg[tr].forEach(x => items.push({ type: 'lec', mins: W(x.rem), x })));
  if (asg.partial) items.push({ type: 'lec', mins: W(asg.partial.raw), x: asg.partial.it, part: asg.partial });

}

function parseLen(s) {
  s = String(s).trim(); let m;
  if (m = s.match(/^(\d+)h(\d{1,2})?$/i)) return +m[1] * 60 + (+m[2] || 0);
  if (m = s.match(/(\d+):(\d{1,2}):(\d{1,2})$/)) return +m[1] * 60 + +m[2] + (+m[3] >= 30 ? 1 : 0);
  if (m = s.match(/(\d+):(\d{1,2})$/)) return +m[1] + (+m[2] >= 30 ? 1 : 0);
  if (m = s.match(/(\d+(?:\.\d+)?)\s*(?:hr|hrs|h)$/i)) return Math.round(+m[1] * 60);
  if (m = s.match(/(\d+(?:\.\d+)?)\s*(?:min|mins|m)$/i)) return Math.round(+m[1]);
  if (m = s.match(/^(\d{1,3})$/)) return +m[1];
  return null;
}
function parseList(text) {

    let ln = raw.trim(); if (!ln) return;
    if (/^#{1,3}\s/.test(ln)) { mod = ln.replace(/^#{1,3}\s*/, '').trim() || 'General'; return; }
    let skip = false; if (ln[0] === '~') { skip = true; ln = ln.slice(1).trim(); }
    let title = ln, len = null; const p = ln.split('|');
    if (p.length > 1) { title = p.slice(0, -1).join('|').trim(); len = parseLen(p[p.length - 1]); }
    if (!title) return; out.push({ id: uid(), t: title, mod, len: len || 40, skip });
  });
  return out;
}

function LCOPY() { const i = document.getElementById('lv-link'); const ok = () => toast('Overlay link copied'); try { navigator.clipboard.writeText(i.value).then(ok, () => { i.select(); document.execCommand('copy'); ok(); }); } catch (e) { i.select(); document.execCommand('copy'); ok(); } }

let LTICK_K = '';
setInterval(() => {
  if (LIVE_OV || !S || TAB !== 'live') return;
  const now = Date.now(), x = liveState(now), t = liveText(x, now);
  const k = [x.st, x.brk && x.brk.a, x.brk && x.brk.e, x.over > 0, !!x.flash, dk()].join('|');
  if (LTICK_K && LTICK_K !== k && !SHEET) render();
  LTICK_K = k;
  const set = (id, v) => { const e = document.getElementById(id); if (e && e.textContent !== v) e.textContent = v; };
  set('lv-big', t.big); set('lv-sub', t.sub); set('lv-today', t.today);

/* ---- overlay (OBS) ---- */
function ovKey(x) {
  const L = S.live;
  return JSON.stringify([x.st, x.brk && [x.brk.lab, x.brk.a, x.brk.e], x.over > 0, x.flash && [x.flash.at, x.flash.ms >= 0], L.look, L.exams, liveSyl().d, liveList().map(i => i.i + (i.done ? 'd' : '') + i.title + i.mins), dk(), CFG().gate, CFG().bits, CFG().speed]);
}
const ACC = { green: '#4CC38A', blue: '#6EA8FF', purple: '#B48CFF', orange: '#FFA94D', pink: '#FF7AB6' };
const THM = { dark: '12,16,26', light: '255,255,255', black: '0,0,0' };
function liveNowLec() {
  const list = liveList(), open = list.filter(i => !i.done), cur = open[0] || null;
  return { list, cur, next: open[1] || null, idx: cur ? list.indexOf(cur) + 1 : list.length, n: list.length, done: list.length - open.length };
}
function ovHTML(x) {
  const lk = S.live.look, t = liveText(x, Date.now()), ex = lk.showExams ? liveExams() : [], L = liveNowLec();
  const lab = [lk.label, dayNum() ? 'Day ' + dayNum() : ''].filter(Boolean).join(' · ');
  const exH = ex.map(e => `<span>${esc(e.n)} <b>${exTxt(e)}</b></span>`).join('');
  if (x.st === 'break' && lk.brkStyle !== 'card') {
    return `<div class="ob ${x.over > 0 ? 'over' : ''}"><div class="ob-lab">${esc(x.over > 0 ? 'Overtime · ' + t.pill : t.pill)}</div>
      <div class="ob-big" data-f="big"></div><div class="ob-sub" data-f="sub"></div>
      <div class="ob-row">Studied today <b data-f="today"></b>${L.cur ? ` · Next up: <b>${esc(L.cur.sub)} — ${esc(L.cur.title)}</b>` : ''}</div>
      ${exH ? `<div class="ob-ex">${exH}</div>` : ''}${lab ? `<div class="ob-tag">${esc(lab)}</div>` : ''}</div>`;
  }
  const lay = ['card', 'compact', 'bar'].includes(lk.layout) ? lk.layout : 'card';
  let pos = lk.pos || 'tr';
  if (lay === 'bar' && !/^(tc|bc)$/.test(pos)) pos = pos[0] === 't' ? 'tc' : 'bc';
  if (lay !== 'bar' && /^(tc|bc)$/.test(pos)) pos = pos[0] + 'r';
  const style = `--sc:${+lk.size || 1};--op:${+lk.opacity || .88};--bgc:${THM[lk.theme] || THM.dark};--ac:${ACC[lk.accent] || ACC.green}`;
  const cls = `op lay-${lay} pos-${pos} t-${THM[lk.theme] ? lk.theme : 'dark'} s-${x.st}${x.over > 0 ? ' over' : ''}`;
  const nowLabel = x.st === 'study' ? 'Now studying' : x.st === 'break' ? 'Up next' : x.st === 'done' ? 'Next up tomorrow' : 'First up';
  if (lay === 'bar') {
    const sep = '<span class="sep"></span>';
    return `<div class="${cls}" style="${style}"><span class="op-pill"><i></i>${esc(t.pill)}</span><span class="op-big" data-f="big"></span>
      ${lk.showNow && L.cur ? `${sep}<span class="op-bnow"><i style="background:${esc(L.cur.color)}"></i><small style="color:${esc(L.cur.color)}">${esc(L.cur.sub)}</small> ${esc(L.cur.title)}</span>` : ''}
      ${lk.showToday ? `${sep}<span class="op-bt">Today <b data-f="today"></b> <small data-f="goal"></small></span>` : ''}
      ${lk.showSyl ? (() => { const y = liveSyl(); return `${sep}<span class="op-bt">Syllabus <b>${y.pct}%</b></span>`; })() : ''}
      ${ex.length ? `${sep}<span class="op-bt">${esc(ex[0].n)} <b>${exTxt(ex[0])}</b></span>` : ''}</div>`;
  }
  const nowH = !lk.showNow ? '' : L.cur
    ? `<div class="op-now" style="--c:${esc(L.cur.color)}"><div class="op-k">${nowLabel} · ${L.idx} of ${L.n}</div><div class="op-ns">${esc(L.cur.sub)}</div><div class="op-nt">${esc(L.cur.title)}</div><div class="op-nl">${hm(L.cur.mins)} at ${CFG().speed}x</div></div>`
    : L.n ? `<div class="op-now" style="--c:var(--ac)"><div class="op-k">Today's lectures</div><div class="op-nt">All ${L.n} done ✓</div></div>` : '';
  const nextH = lk.showNext && L.next && lay === 'card' ? `<div class="op-next"><span class="op-k">Then</span> <b style="color:${esc(L.next.color)}">${esc(L.next.sub)}</b> — ${esc(L.next.title)}</div>` : '';
  const listH = lk.showList && lay === 'card' && L.n ? `<div class="op-lh"><span class="op-k">Today · ${CFG().speed}x</span><span class="op-k">${L.done}/${L.n} done</span></div>${L.list.slice(0, 8).map(i => `<div class="op-li ${i.done ? 'xd' : ''}" style="--c:${esc(i.color)}"><span class="cb">${i.done ? '✓' : ''}</span><span class="tx"><b>${esc(i.title)}</b></span></div>`).join('')}` : '';
  const syl = lk.showSyl ? (() => { const y = liveSyl(); return `<div class="op-day"><span class="op-k">Syllabus</span><span class="op-v">${y.d}<small> / ${y.n} lectures · ${y.pct}%</small></span></div><div class="op-bar syl"><b style="width:${y.pct}%"></b></div>`; })() : '';
  const today = lk.showToday ? `<div class="op-day"><span class="op-k">Today</span><span class="op-v"><span data-f="today"></span> <small data-f="goal"></small></span></div><div class="op-bar"><b data-f="tbar"></b></div>` : '';
  const meta = (lk.showNet ? `<span data-f="net" data-h="1"></span>` : '') + (lk.showAll ? `<span>All-time <b data-f="all"></b></span>` : '');
  return `<div class="${cls}" style="${style}">
    <div class="op-top"><span class="op-pill"><i></i>${esc(x.over > 0 ? 'Overtime · ' + t.pill : t.pill)}</span><span class="op-lab">${esc(lab)}</span></div>
    <div class="op-big" data-f="big"></div>${lk.showNextBrk || x.st !== 'study' ? `<div class="op-sub" data-f="sub"></div>` : ''}
    ${t.flash && lk.showNet ? `<div class="op-flash ${x.flash.ms >= 0 ? 'g' : 'r'}">${esc(t.flash)}</div>` : ''}
    ${nowH}${nextH}
    ${today || syl || meta ? `<div class="op-stats">${today}${syl}${meta ? `<div class="op-meta">${meta}</div>` : ''}</div>` : ''}
    ${listH}${exH ? `<div class="op-ex">${exH}</div>` : ''}</div>`;
}
function livePaint(host, now) {
  const x = liveState(now), k = ovKey(x);
  if (host._k !== k) { host._k = k; host.innerHTML = ovHTML(x); host._els = [...host.querySelectorAll('[data-f]')]; }
  const t = liveText(x, now);
  for (const el of host._els) {
    const f = el.dataset.f, v = t[f] == null ? '' : t[f];
    if (f === 'tbar') { if (el.style.width !== v) el.style.width = v; }
    else if (el.dataset.h) { if (el.innerHTML !== v) el.innerHTML = v; }
    else if (el.textContent !== v) el.textContent = v;
  }
  liveAlerts(x, now);
}
function liveOverlayInit() {
  document.documentElement.classList.add('lvov');
  // read-only: nothing from the overlay is ever saved or uploaded
  saveLocal = () => {}; flush = async () => {}; WR = () => {}; paintSync = () => {};
  S = { core: freshCore(), done: {}, mods: {}, days: {} }; migrate();
  SYNC.code = LIVE_OV;
  let ready = false;
  const orig = onRemote;
  onRemote = v => { if (v && v.core) { ready = true; orig(v); } };
  render = () => { LPLAN = null; LTMP = null; };
  const stage = document.createElement('div'); stage.className = 'lv-stage'; document.body.appendChild(stage);
  const fit = () => { stage.style.transform = `scale(${(window.innerWidth || 1920) / 1920})`; };
  fit(); addEventListener('resize', fit);
  startSync();
  setInterval(() => { if (ready) { try { livePaint(stage, Date.now()); } catch (e) { console.error(e); } } }, 250);
}

/* ---------------- shell ---------------- */
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove('show'), 2200); }
let renderQueued = false;
function render() {
  // never redraw under the keyboard: wait until the field loses focus
  const ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type !== 'checkbox' && document.getElementById('app').contains(ae) && !SHEET) { renderQueued = true; return; }
  renderQueued = false; LPLAN = null; LTMP = null;
  const V = { today: viewToday, study: viewStudy, body: viewBody, progress: viewProgress, live: viewLive, set: viewSet }[TAB] || viewToday;
  let body;
  try { body = head() + V(); }
  catch (err) { console.error(err); body = `<h1>Something broke</h1><div class="card warn"><p class="sm">${esc(err && err.message || err)}</p><button class="btn wide" onclick="go('today')">Go to Today</button></div>`; }
  const y = window.scrollY;
  applyScale();
  document.getElementById('app').innerHTML = body;
  document.getElementById('sheet').innerHTML = sheetHTML() + joinHTML();
  paintTimer();
  const rc = dueRev(dk(), 1e9).all.length;
  document.getElementById('nav').innerHTML = [['today', 'Today'], ['study', 'Study'], ['body', 'Body'], ['progress', 'Progress'], ['live', 'Live'], ['set', 'Settings']]
    .map(([k, l]) => `<button aria-current="${TAB === k}" onclick="go('${k}')"><span class="pip"></span>${l}${k === 'study' && rc ? ' · ' + rc : ''}</button>`).join('');
  window.scrollTo(0, y);
}
document.addEventListener('focusout', () => setTimeout(() => { if (renderQueued) render(); }, 30));
function go(t) { TAB = t; saveLocal(); render(); window.scrollTo(0, 0); }
let lastMin = -1;
setInterval(() => {
  const m = curMin(); const e = document.getElementById('bigclock'); if (e) e.innerHTML = clockS();
  if (m !== lastMin && TAB === 'today' && !SHEET) { lastMin = m; if (m % 5 === 0) render(); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); flush(); } });

(function init() {
  if (LIVE_OV) return liveOverlayInit();
  if (!loadLocal()) {
    S = { core: freshCore(), done: {}, mods: {}, days: {} };
    SYNC.code = newCode();                 // sync on by default, private random code
    Object.assign(SYNC.pending, fullMap());
  }
  migrate(); saveLocal(); render(); startSync();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
window.addEventListener('resize', () => { if (S) applyScale(); });
