<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2343A6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>Pragati Study Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: ledger-book study desk. Three tabs. Sections are boxed cards with a tinted header; tappable things have a blue border or a › arrow. */
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --sunk:#E4E8F1; --ink:#1A1F2E; --muted:#5B6377; --line:#D3D9E5;
  --accent:#2343A6; --accent-ink:#FFFFFF; --accent-soft:#E2E8FA; --margin:#C8452E;
  --good:#1D7748; --good-soft:#DDF1E5; --warn:#9A5B00; --warn-soft:#FBEED6; --bad:#B3261E; --bad-soft:#FBE2DF;
  --f-display:'Young Serif',Georgia,'Times New Roman',serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111C; --surface:#161C2A; --sunk:#1F2738; --ink:#E5E8F1; --muted:#9AA3B8; --line:#2C3549;
  --accent:#8FA8F5; --accent-ink:#0E1320; --accent-soft:#222F57; --margin:#E07A62;
  --good:#5CC08D; --good-soft:#163427; --warn:#E3A74A; --warn-soft:#3A2B11; --bad:#F08A80; --bad-soft:#3D1D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111C; --surface:#161C2A; --sunk:#1F2738; --ink:#E5E8F1; --muted:#9AA3B8; --line:#2C3549;
  --accent:#8FA8F5; --accent-ink:#0E1320; --accent-soft:#222F57; --margin:#E07A62;
  --good:#5CC08D; --good-soft:#163427; --warn:#E3A74A; --warn-soft:#3A2B11; --bad:#F08A80; --bad-soft:#3D1D1B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgb(0 0 0 / .05)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:10px;cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
nav.tabs .brand{display:none}
main{padding:16px 16px 100px;max-width:760px;width:100%;margin:0 auto;min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:220px 1fr}
  nav.tabs{position:sticky;top:0;height:100vh;grid-template-columns:1fr;grid-auto-rows:min-content;gap:4px;border-top:0;border-right:1px solid var(--line);padding:20px 12px;box-shadow:none}
  nav.tabs .brand{display:block;font-family:var(--f-display);font-size:20px;padding:4px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
  nav.tabs .brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 12px}
  main{padding:28px 32px 48px}
}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--margin)}
.top h1{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.15;margin:0;text-wrap:balance}
.top .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.round{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;font-weight:700}
.round svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font-weight:700;padding:6px 0;margin-bottom:4px;cursor:pointer;font-size:15px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
.sh{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 14px;background:var(--sunk);border-bottom:1px solid var(--line);min-height:46px}
.sh h2{flex:1;margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.sb{padding:14px}
.sb.flush{padding:0}
.info-btn{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);font:italic 700 15px Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0}
.info-btn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.info{background:var(--accent-soft);padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line);line-height:1.55}
.info ul{margin:4px 0 0;padding-left:18px}
.big{font-family:var(--f-display);font-size:36px;line-height:1.05}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:13px;min-height:34px}
.btn.on{background:var(--accent);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;min-width:52px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chips input{width:84px;min-height:38px;padding:6px 10px;border-radius:999px;text-align:center}
/* topic rows */
.trow{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px 12px 22px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;position:relative;color:var(--ink)}
.trow:last-child{border-bottom:0}
.trow::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:1.5px;background:var(--margin);opacity:.5}
.trow:hover{background:var(--accent-soft)}
.box{flex:none;width:24px;height:24px;border:2px solid var(--accent);border-radius:7px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--surface);margin-top:1px}
.trow .t{flex:1;min-width:0}
.trow .nm{font-weight:600;overflow-wrap:anywhere}
.trow .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.trow.done .box{background:var(--good);border-color:var(--good)}
.trow.done .nm{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--good);color:var(--muted)}
.vrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}.vrow:last-child{border-bottom:0}.vrow .trow{border-bottom:0;flex:1;min-width:0}.vrow .watch{flex:none;display:flex;align-items:center;padding:0 12px 0 4px;background:var(--surface)}
.unit-h{padding:8px 14px;font-size:13px;font-weight:700;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.subj-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:var(--surface);border:0;text-align:left;cursor:pointer;color:var(--ink)}
.subj-h:hover{background:var(--accent-soft)}
.subj-h .t{flex:1;min-width:0}
.subj-h .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.caret{flex:none;color:var(--accent);font-weight:700;border:1.5px solid var(--accent);border-radius:7px;padding:1px 8px;font-size:12px}
.segs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:11px;margin:0 0 14px;border:1px solid var(--line)}
.segs button{flex:1;border:0;background:transparent;padding:9px 12px;border-radius:8px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.segs button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.empty{padding:18px 14px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.note{border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.good{background:var(--good-soft);color:var(--good)} .note.acc{background:var(--accent-soft);color:var(--accent)}
.plain{padding:12px 14px;border-bottom:1px solid var(--line)} .plain:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.hint{font-size:12px;font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=password],select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:15px;font-weight:400;color:var(--ink);min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:90px;resize:vertical;line-height:1.55}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.pill-opts{display:flex;gap:6px;flex-wrap:wrap}
.pill-opts label{border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:600}
.pill-opts input{position:absolute;opacity:0;pointer-events:none}
.pill-opts label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.scrim{position:fixed;inset:0;background:rgb(10 14 25 / .5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 12px}
.sheet form{display:flex;flex-direction:column;gap:12px}
.sheet .acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:92vw;display:flex;align-items:center;gap:12px;min-height:44px}
.toast button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
@media (min-width:900px){.toast{bottom:28px}}
.walk{position:fixed;inset:0;z-index:50;background:rgb(10 14 25 / .6);display:grid;place-items:center;padding:16px}
.walk .wbox{background:var(--surface);border-radius:16px;max-width:440px;width:100%;padding:22px;border:1px solid var(--line)}
.walk .step{font-family:var(--f-mono);font-size:12px;color:var(--margin)}
.walk h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:6px 0 8px}
.dots{display:flex;gap:5px;margin:14px 0}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)} .dots i.on{background:var(--accent);width:18px}
.help-card h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 4px}
.help-card ul{padding-left:20px;margin:6px 0 0}
.help-card li{margin-bottom:4px;max-width:65ch}
code{font-family:var(--f-mono);font-size:13px;background:var(--sunk);padding:1px 5px;border-radius:4px}
[hidden]{display:none!important}
/* clock, focus mode, break reminder */
.clock-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock-big{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:40px;font-weight:600;line-height:1;letter-spacing:-.02em}
.clock-big small{font-size:18px;color:var(--muted);margin-left:2px}
.focus,.brk{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.focus{background:var(--bg);color:var(--ink);gap:12px;justify-content:flex-start;overflow-y:auto;padding-top:calc(64px + env(safe-area-inset-top,0px))}
.flist{width:min(100%,560px);text-align:left;margin-top:8px}
.focus .fc{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(56px,18vw,160px);line-height:1;letter-spacing:-.03em}
.focus .fc small{font-size:.32em;color:var(--muted)}
.focus .fd{font-family:var(--f-display);font-size:clamp(20px,5vw,32px)}
.focus .fx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.brk{background:var(--accent);color:var(--accent-ink);gap:16px;z-index:80}
.brk h2{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,9vw,64px);margin:0;line-height:1.1;text-wrap:balance}
.brk p{font-size:18px;margin:0;max-width:30ch;opacity:.9}
.brk .bt{font-family:var(--f-mono);font-size:clamp(40px,12vw,90px);font-weight:600;font-variant-numeric:tabular-nums}
.brk .bb{background:var(--accent-ink);color:var(--accent);border:0;border-radius:14px;padding:16px 34px;font-size:20px;font-weight:700;cursor:pointer;min-width:220px}
.brk .bs{background:transparent;color:var(--accent-ink);border:2px solid var(--accent-ink);border-radius:14px;padding:12px 24px;font-size:16px;font-weight:700;cursor:pointer;min-width:220px}
.brk .bpane{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.brk .wopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,380px)}
.brk .wopt{background:var(--accent-ink);color:var(--accent);border:0;border-radius:12px;padding:16px 0;font-weight:700;font-size:18px;cursor:pointer}
.brk .row .bs{min-width:0;flex:1}
.walker{width:84px;height:84px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.brk .walker{animation:bob 1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.sheet,.walk .wbox{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="app">
  <nav class="tabs" id="tabs" aria-label="Main">
    <div class="brand">Study Desk<small>B.Com · Pragati</small></div>
    <button data-nav="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
    <button data-nav="syllabus"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Syllabus</button>
    <button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>
  <main id="view"></main>
</div>
<div id="sheet-root"></div>
<div id="walk-root"></div>
<div class="focus" id="focus" hidden role="dialog" aria-label="Focus clock"><button class="btn fx" data-act="focusOff">✕ Exit</button><div class="fd" id="f-date"></div><div class="fc" id="f-clock"></div><div class="tag acc" style="font-size:15px;padding:6px 12px" id="f-next"></div><div class="small muted" id="f-prog"></div><div class="flist" id="f-list"></div></div>
<div class="brk" id="brk" hidden role="alertdialog" aria-labelledby="brk-h">
<div class="bpane" id="brk-ask"><div class="bt" id="brk-time"></div><svg class="walker" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M9 21l2.5-6.5L14 17v4M11.5 14.5L12 9l-3 2-1.5 3M12 9l3 3 3 1"/></svg><h2 id="brk-h">Stand up and walk</h2><p>Pick how long you will walk. The app rings when time is up.</p>
<div class="wopts"><button class="wopt" data-act="brkWalk" data-m="1">1 min</button><button class="wopt" data-act="brkWalk" data-m="3">3 min</button><button class="wopt" data-act="brkWalk" data-m="5">5 min</button><button class="wopt" data-act="brkWalk" data-m="10">10 min</button></div>
<div class="row" style="justify-content:center;width:min(100%,380px)"><button class="bs" data-act="brkDone">Skip</button><button class="bs" data-act="brkSnooze">Snooze 5 min</button></div></div>
<div class="bpane" id="brk-run" hidden><h2>Walking…</h2><div class="bt" id="brk-cd">0:00</div><p>Keep moving. The app will ring when time is up.</p><button class="bs" data-act="brkStop">Stop early</button></div>
<div class="bpane" id="brk-end" hidden><h2>Walk done</h2><p>Sit down, drink some water and get back to study.</p><button class="bb" data-act="brkBack">Back to study ✓</button></div>
</div>
<div class="toast" id="toast" hidden role="status"><span id="toast-msg"></span><button id="toast-undo" hidden>Undo</button></div>

<script>
(function(){
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const fmt=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:(s.slice(0,4)!==today().slice(0,4))?'numeric':undefined}):'';
const hrs=h=>{h=+h||0;const H=Math.floor(h),M=Math.round((h-H)*60);return (H?H+' hr':'')+(M?(H?' ':'')+M+' min':'')||'0 min'};

/* ================= state ================= */
function mkTopic(name){return {id:uid(),name,done:'',r1:'',r2:'',rf:''}}
function fresh(){const sem={id:uid(),name:'Semester 1',exam:''};return {v:3,meta:{updated:0},sems:[sem],activeSem:sem.id,subjects:[],plan:{date:'',hours:0,ids:[],mode:''},hoursLog:{},
  set:{theme:'system',mpt:45,rmin:15,buffer:5,hours:2,vshare:50,speed:1,brkOn:true,brkEvery:30,brkFrom:'07:00',brkTo:'23:00',brkSound:true,tutDone:false},open:{}}}
function loadPack(){for(const ps of PACK.subjects){if(S.subjects.some(s=>s.pk===ps.key))continue;
  S.subjects.push({id:uid(),pk:ps.key,semId:S.activeSem,name:ps.name,kind:PACK.kinds[ps.key]||'Other',exam:'',units:ps.units.map(([un,ts])=>({id:uid(),name:un,topics:ts.map(([k,n])=>mkTopic(n))}))})}
  S.packVer=PACK.ver}
/* convert data from the earlier, bigger version of the app */
function fromOld(o){const n=fresh();n.sems=(o.sems||n.sems).map(s=>({id:s.id,name:s.name,exam:s.exam||''}));n.activeSem=o.activeSem||n.sems[0].id;
  n.subjects=(o.subjects||[]).filter(s=>!s.ex).map(s=>({id:s.id,pk:s.pk||'',semId:s.semId,name:s.name,kind:({'Core':'DSC (Core)','Elective':'GE (Elective)'})[s.kind]||(s.pk&&PACK.kinds[s.pk])||'Other',exam:s.exam||'',
    units:(s.units||[]).map(u=>({id:u.id,name:u.name,topics:(u.topics||[]).map(x=>({id:x.id,name:x.name,done:x.st>0?(x.d&&x.d.s)||today():'',r1:(x.d&&x.d.r1)||'',r2:(x.d&&x.d.r2)||'',rf:''}))}))}));
  if(o.set){n.set.theme=o.set.theme||'system';n.set.tutDone=!!o.set.tutDone}return n}
function migrate(){const f=fresh();for(const k of Object.keys(f))if(S[k]===undefined)S[k]=f[k];S.set=Object.assign({},f.set,S.set);S.meta=S.meta||{updated:0};S.open=S.open||{};S.hoursLog=S.hoursLog||{};
  for(const s of S.subjects){s.units=s.units||[];s.videos=s.videos||[];for(const u of s.units)for(const x of u.topics){if(x.done==null)x.done='';if(x.rev&&!x.r1)x.r1=x.rev;delete x.rev;for(const k of ['r1','r2','rf'])if(x[k]==null)x[k]=''}}}
let S;
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);migrate();return}}catch(e){}
  try{const o=localStorage.getItem(OLDKEY);if(o){S=fromOld(JSON.parse(o));if(!S.subjects.length)loadPack();save(true);return}}catch(e){}
  S=fresh();loadPack()}
function save(noSync){S.meta.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device. Download a backup from Settings.')}if(!noSync)schedulePush()}
load();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ================= lookups ================= */
const sem=()=>S.sems.find(s=>s.id===S.activeSem)||S.sems[0];
const semSubs=()=>S.subjects.filter(s=>s.semId===S.activeSem);
const sub=id=>S.subjects.find(s=>s.id===id);
function topicsOf(s){const a=[];for(const u of s.units)for(const x of u.topics)a.push(x);return a}
function findTopic(id){for(const s of S.subjects)for(const u of s.units){const x=u.topics.find(t=>t.id===id);if(x)return {s,u,x}}return null}
const examOf=s=>s.exam||sem().exam||'';
function count(list){let n=0,d=0;for(const s of list)for(const x of topicsOf(s)){n++;if(x.done)d++}return {n,d,left:n-d}}
function streak(){const set=new Set();for(const s of S.subjects)for(const x of topicsOf(s)){for(const k of ['done','r1','r2','rf'])if(x[k])set.add(x[k])}let d=today();if(!set.has(d))d=addDays(d,-1);let n=0;while(set.has(d)){n++;d=addDays(d,-1)}return n}

/* ================= daily plan ================= */
/* Revision schedule: Rev 1 is due 3 days after studying, Rev 2 is due 7 days after Rev 1,
   and in the last revision days before the exam every studied topic gets one final revision. */
const RK={r1:'Revision 1',r2:'Revision 2',rf:'Final revision'};
function winStart(s){const e=examOf(s);return e?addDays(e,-(+S.set.buffer||0)):''}
function revDue(x,s,t){if(!x.done)return null;
  const ws=winStart(s),e=examOf(s);
  if(e&&ws&&t>=ws&&t<=e){const last=[x.rf,x.r2,x.r1].filter(Boolean).sort().pop()||'';if(!x.rf&&last<ws&&x.done<ws)return {k:'rf',on:ws}}
  if(!x.r1)return {k:'r1',on:addDays(x.done,3)};
  if(!x.r2)return {k:'r2',on:addDays(x.r1,7)};
  return null}
function daysFor(s){const t=today(),e=examOf(s);if(!e||e<t)return null;const L=diff(t,e),B=+S.set.buffer||0;return Math.max(1,L-B>0?L-B:L)}
function pace(){let need=0,undated=0;for(const s of semSubs()){const left=topicsOf(s).filter(x=>!x.done).length;if(!left)continue;const d=daysFor(s);if(d==null){undated+=left;continue}need+=left/d}return {need:Math.ceil(need-1e-9),undated}}
const MPT=()=>Math.max(10,+S.set.mpt||45), RMIN=()=>Math.max(5,+S.set.rmin||15);
function fits(h){return Math.max(1,Math.floor((+h||0)*60/MPT()))}
function todaySel(){return S.subjToday&&S.subjToday.date===today()?S.subjToday.ids.filter(id=>sub(id)&&sub(id).semId===S.activeSem):[]}
function planSubs(){const sel=todaySel();return sel.length?semSubs().filter(s=>sel.includes(s.id)):semSubs()}
function pickTopics(n,exclude){
  const out=[];for(const id of S.pending||[]){if(out.length>=n)break;const f=findTopic(id);if(f&&!f.x.done&&planSubs().includes(f.s)&&!exclude.has(id)){out.push(id);exclude=new Set([...exclude,id])}}
  const pool=[];
  for(const s of planSubs()){const left=topicsOf(s).filter(x=>!x.done&&!exclude.has(x.id));if(!left.length)continue;const d=daysFor(s);pool.push({s,left,d:d==null?90:d,e:examOf(s)||'9999',k:0})}
  const even=todaySel().length>0;const sc=p=>even?1/(1+p.k):p.left.length/p.d/(1+p.k);
  while(out.length<n&&pool.length){pool.sort((a,b)=>sc(b)-sc(a)||(a.e<b.e?-1:1));const p=pool[0];out.push(p.left.shift().id);p.k++;if(!p.left.length)pool.shift()}
  return out;
}
function dueRevisions(exclude){const t=today(),out=[];
  for(const s of semSubs())for(const x of topicsOf(s)){if(exclude.has(x.id))continue;const d=revDue(x,s,t);if(d&&d.on<=t)out.push({id:x.id,k:d.k,on:d.on,e:examOf(s)||'9999'})}
  out.sort((a,b)=>(a.on<b.on?-1:a.on>b.on?1:0)||(a.e<b.e?-1:1));return out}
function extraRevisions(n,exclude){const all=[];for(const s of semSubs())for(const x of topicsOf(s))if(x.done&&!exclude.has(x.id))all.push({id:x.id,e:examOf(s)||'9999',last:[x.rf,x.r2,x.r1,x.done].filter(Boolean).sort().pop()});
  all.sort((a,b)=>(a.last<b.last?-1:1)||(a.e<b.e?-1:1));return all.slice(0,n).map(a=>({id:a.id,k:'rx'}))}
/* ---- lectures ---- */
const vMin=v=>Math.max(1,Math.round((+v.min||0)/(+S.set.speed||1)));
function findVideo(id){for(const s of S.subjects){const v=(s.videos||[]).find(x=>x.id===id);if(v)return {s,v}}return null}
function vcount(list){let n=0,w=0,left=0;for(const s of list)for(const v of s.videos||[]){n++;if(v.w)w++;else left+=vMin(v)}return {n,w,left}}
function pickVideos(budget,topicIds,exclude){
  const out=[];let used=0;const tset=new Set(topicIds);
  const fitsIn=v=>!out.length&&budget>0||used+vMin(v)<=budget;
  for(const s of semSubs())for(const v of s.videos||[]){if(v.w||exclude.has(v.id)||!v.topicId||!tset.has(v.topicId))continue;if(!fitsIn(v))continue;out.push(v.id);used+=vMin(v)}
  const pool=[];for(const s of planSubs()){const left=(s.videos||[]).filter(v=>!v.w&&!exclude.has(v.id)&&!out.includes(v.id));if(!left.length)continue;const d=daysFor(s);pool.push({left,d:d==null?90:d,e:examOf(s)||'9999',k:0})}
  const sc=p=>p.left.reduce((a,v)=>a+vMin(v),0)/p.d/(1+p.k);
  while(pool.length){pool.sort((a,b)=>sc(b)-sc(a)||(a.e<b.e?-1:1));const p=pool[0],v=p.left[0];if(!fitsIn(v))break;out.push(v.id);used+=vMin(v);p.left.shift();p.k++;if(!p.left.length)pool.shift()}
  return out}
function buildPlan(hours){
  const t=today(),old=S.plan&&S.plan.date===t?S.plan:null;
  const dt=doneToday();const keepNew=dt.ids,keepRev=dt.rev,keepVid=dt.vids;
  const skip=old&&old.skip?old.skip.slice():[];
  let mins=(+hours||0)*60-keepNew.length*MPT()-keepRev.length*RMIN()-keepVid.reduce((a,id)=>a+vMin(findVideo(id).v),0);
  const ex=new Set(keepNew.concat(keepRev.map(r=>r.id),skip));
  const leftNew=planSubs().reduce((a,s)=>a+topicsOf(s).filter(x=>!x.done).length,0);
  const due=dueRevisions(ex);
  const revCap=leftNew?Math.max(1,Math.floor(Math.max(0,mins)*0.5/RMIN())):Math.floor(Math.max(0,mins)/RMIN());
  const rev=keepRev.concat(due.slice(0,revCap).map(r=>({id:r.id,k:r.k})));
  mins-=Math.min(due.length,revCap)*RMIN();
  rev.forEach(r=>ex.add(r.id));

function sylText(s){return s.units.map(u=>u.name+'\n'+u.topics.map(x=>'- '+x.name).join('\n')).join('\n\n')}
function parseSyl(text,old){const byName={};if(old)for(const u of old.units)for(const x of u.topics)byName[x.name.trim().toLowerCase()]=x;
  const units=[];let cur=null;
  text.split('\n').forEach(raw=>{const l=raw.trim();if(!l)return;
    if(/^(unit|module|chapter|block|इकाई)\b/i.test(l)||/:\s*$/.test(l)){cur={id:uid(),name:l.replace(/:\s*$/,'').replace(/^(unit\s*\w+)\s*[:\-–]\s*/i,'$1 · '),topics:[]};units.push(cur);return}
    if(!cur){cur={id:uid(),name:'Unit '+(units.length+1),topics:[]};units.push(cur)}
    l.replace(/^([-*•·]|\d+[.)])\s*/,'').split(/\s*;\s*/).filter(Boolean).forEach(n=>{const prev=byName[n.toLowerCase()];cur.topics.push(prev?prev:mkTopic(n))})});
  return units}
function subForm(id){const s=id?sub(id):null;
  sheet({title:s?'Edit subject':'Add subject',body:`<label class="f">Subject name<input type="text" name="name" required value="${esc(s?s.name:'')}" placeholder="Financial Accounting"></label>
  <div class="fgrid"><label class="f">Type<select name="kind">${KINDS.map(k=>`<option ${s&&s.kind===k?'selected':''}>${k}</option>`).join('')}</select></label><label class="f">Exam date (optional)<input type="date" name="exam" value="${esc(s?s.exam:'')}"><span class="hint">Leave empty to use the semester date</span></label></div>
  <label class="f">Syllabus<textarea name="syl" style="min-height:260px" placeholder="Unit 1: Introduction&#10;- Meaning and scope&#10;- Concepts&#10;Unit 2: Final accounts&#10;- Trading account">${esc(s?sylText(s):'')}</textarea><span class="hint">A line starting with "Unit" starts a new unit. Every other line is a topic. Topics you already crossed stay crossed if you keep their name.</span></label>`,
  onSubmit:d=>{const units=parseSyl(d.syl||'',s);if(s){s.name=d.name;s.kind=d.kind;s.exam=d.exam;s.units=units}else S.subjects.push({id:uid(),semId:S.activeSem,name:d.name,kind:d.kind,exam:d.exam,units});S.plan.date=''},
  del:s?()=>{S.subjects=S.subjects.filter(x=>x!==s);S.plan.date='';closeSheet();save();render();toast('Subject deleted')}:null})}
function semForm(id){const x=id?S.sems.find(s=>s.id===id):null;
  sheet({title:x?'Edit semester':'Add semester',body:`<label class="f">Name<input type="text" name="name" required value="${esc(x?x.name:'Semester '+(S.sems.length+1))}"></label><label class="f">Exams start on<input type="date" name="exam" value="${esc(x?x.exam:'')}"></label>${x?'':'<label class="row" style="font-weight:600"><input type="checkbox" name="cur" checked style="width:20px;height:20px;accent-color:var(--accent)"> Make it the current semester</label>'}`,
  onSubmit:d=>{if(x){x.name=d.name;x.exam=d.exam}else{const n={id:uid(),name:d.name,exam:d.exam};S.sems.push(n);if(d.cur)S.activeSem=n.id}S.plan.date=''},
  del:x&&S.sems.length>1?()=>{S.subjects=S.subjects.filter(s=>s.semId!==x.id);S.sems=S.sems.filter(s=>s!==x);if(S.activeSem===x.id)S.activeSem=S.sems[0].id;S.plan.date='';closeSheet();save();render();toast('Semester deleted')}:null})}

Format:

   "videos": [
     {"title": "<lecture title>", "minutes": <length in whole minutes>, "url": "<link, or empty>", "topic": "<the syllabus topic it covers, copied exactly from the list below, or empty>"}
   ]}

Rules:
- Keep the lectures in the same order I give them.
- Convert lengths to whole minutes: 1:05:30 becomes 66, 45:20 becomes 45, "1 hr 10 min" becomes 70.
- If a link is missing, use "".
- Pick a topic only if you are sure; otherwise use "".
- One object per subject.

My subjects and their topics:
${subs.map(s=>`\n${s.name}\n`+topicsOf(s).map(x=>'  - '+x.name).join('\n')).join('\n')}

My lecture list:
<paste your lecture names, lengths, links and subject here>`}
function vidPromptSheet(){sheet({title:'Prompt for Claude',submit:false,body:`<div class="small">1. Tap <b>Copy prompt</b>. 2. Paste it in Claude and replace the last line with your lecture list. 3. Copy the JSON Claude gives you. 4. Come back and tap <b>+ Add lectures</b>.</div><textarea id="prompt-text" readonly style="min-height:260px;font-size:13px">${esc(claudePrompt())}</textarea><button type="button" class="btn primary" data-act="copyPrompt">Copy prompt</button>`})}
function parseLen(m){if(typeof m==='number')return m;m=String(m||'').trim();if(/^\d+(\.\d+)?$/.test(m))return +m;const p=m.split(':').map(Number);if(p.length===3)return p[0]*60+p[1]+p[2]/60;if(p.length===2)return p[0]+p[1]/60;const h=m.match(/(\d+)\s*h/i),mi=m.match(/(\d+)\s*m/i);return (h?+h[1]*60:0)+(mi?+mi[1]:0)}
const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9ऀ-ॿ]+/g,' ').trim();
function importVideos(text){
  let data;try{data=JSON.parse(text.trim().replace(/^```(json)?/,'').replace(/```$/,''))}catch(e){return {err:'This is not valid JSON. Copy the whole reply from Claude, from [ to ].'}}
  if(!Array.isArray(data))data=[data];
  if(data.length&&!data[0].videos&&data[0].subject){const g={};data.forEach(v=>{(g[v.subject]=g[v.subject]||[]).push(v)});data=Object.keys(g).map(k=>({subject:k,videos:g[k]}))}
  const subs=semSubs(),res=[],miss=[];
  for(const grp of data){const key=norm(grp.subject);const s=subs.find(x=>norm(x.name)===key)||subs.find(x=>key&&(norm(x.name).includes(key)||key.includes(norm(x.name))));
    if(!s){miss.push(grp.subject||'(no subject)');continue}
    s.videos=s.videos||[];let n=0,skip=0;
    for(const v of grp.videos||[]){const title=String(v.title||v.name||'').trim();if(!title)continue;
      if(s.videos.some(o=>(v.url&&o.url===v.url)||o.title===title)){skip++;continue}
      let topicId='';if(v.topic){const tk=norm(v.topic);const x=topicsOf(s).find(t=>norm(t.name)===tk)||topicsOf(s).find(t=>tk&&(norm(t.name).includes(tk)||tk.includes(norm(t.name))));if(x)topicId=x.id}
      s.videos.push({id:uid(),title,min:Math.round(parseLen(v.minutes!=null?v.minutes:(v.length||v.duration))),url:String(v.url||v.link||''),topicId,w:''});n++}
    res.push(`${s.name}: ${n} added${skip?`, ${skip} already there`:''}`)}
  return {res,miss}}
function vidImportForm(){sheet({title:'Add lectures',submit:'Add lectures',body:`<div class="small">Paste the JSON from Claude. Don't have it yet? <button type="button" class="btn sm" data-act="vidPrompt">Get the Claude prompt</button></div>
  <label class="f">JSON<textarea name="t" required style="min-height:220px;font-family:var(--f-mono);font-size:13px" placeholder='[{"subject":"Financial Accounting","videos":[{"title":"Depreciation one-shot","minutes":95,"url":"https://youtu.be/...","topic":""}]}]'></textarea></label><div id="imp-msg" class="small" style="color:var(--bad)"></div>`,
  onSubmit:d=>{const r=importVideos(d.t);if(r.err){$('#imp-msg').textContent=r.err;return false}if(!r.res.length){$('#imp-msg').textContent='No subject matched. Subject names must match your subjects: '+semSubs().map(s=>s.name).join(', ');return false}
    S.plan.date='';setTimeout(()=>toast(r.res.join(' · ')+(r.miss.length?` · Not matched: ${r.miss.join(', ')}`:'')),50)}})}

/* ================= actions ================= */
function tapTopic(id){const f=findTopic(id);if(!f)return;const snap={done:f.x.done,r1:f.x.r1,r2:f.x.r2,rf:f.x.rf};if(snap.done){f.x.done='';f.x.r1='';f.x.r2='';f.x.rf=''}else f.x.done=today();save();render();
  toast(snap.done?'Marked not done':'✓ Done. Revision in 3 days: '+f.x.name.slice(0,30),()=>{Object.assign(f.x,snap);save();render()})}
const A={
  nav:el=>go(el.dataset.v),
  fs:()=>{if(document.fullscreenElement)exitFull();else{const p=goFull();if(!p&&!document.fullscreenEnabled)toast('Full screen is not available here. Install the app for a full-screen view.')}},
  focusOn:()=>{unlockAudio();$('#focus').hidden=false;renderFocus();clockTick();goFull();wake(true)},
  focusOff:()=>{$('#focus').hidden=true;exitFull();wake(false)},
  brkDone:()=>{hideBreak();toast('Skipped. Next break '+(nextBreak()?'at '+tFmt(nextBreak()):'later'))},
  brkWalk:el=>{unlockAudio();clearInterval(BRK.rep);BRK.walkEnd=Date.now()+(+el.dataset.m)*60000;brkPane('run');walkTick();try{navigator.serviceWorker&&navigator.serviceWorker.getRegistration&&navigator.serviceWorker.getRegistration().then(r=>r&&r.getNotifications&&r.getNotifications({tag:'break'}).then(ns=>ns.forEach(n=>n.close()))).catch(()=>{})}catch(e){}},
  brkStop:()=>{BRK.walkEnd=0;brkPane('end')},
  brkBack:()=>{hideBreak();toast('Back to study. Next break '+(nextBreak()?'at '+tFmt(nextBreak()):'later'))},
  brkSnooze:()=>{hideBreak();BRK.snooze=Date.now()+5*60000;toast('Snoozed for 5 minutes')},
  brkTest:()=>{unlockAudio();showBreak()},
  notifAsk:()=>{try{Notification.requestPermission().then(()=>render())}catch(e){toast('Notifications are not supported here')}},
  info:el=>{const k=el.dataset.k,on=!UI.info.has(k);on?UI.info.add(k):UI.info.delete(k);const box=el.closest('.section').querySelector(':scope > .info');if(box)box.hidden=!on;el.setAttribute('aria-expanded',on)},
  theme:()=>{const dark=matchMedia('(prefers-color-scheme: dark)').matches;const cur=S.set.theme==='system'?(dark?'dark':'light'):S.set.theme;S.set.theme=cur==='dark'?'light':'dark';save();render()},
  setTheme:el=>{S.set.theme=el.value;save();render()},
  subjToggle:el=>{const id=el.dataset.id;let ids=todaySel().slice();if(id==='all')ids=[];else ids=ids.includes(id)?ids.filter(x=>x!==id):ids.concat(id);if(ids.length&&ids.length===semSubs().filter(s=>topicsOf(s).length).length)ids=[];
    S.subjToday={date:today(),ids};ensurePlan();buildPlan(S.plan.hours);save();render()},
  setHours:el=>{const h=+el.dataset.h;S.hoursLog[today()]=h;buildPlan(h);save();render()},
  tapTopic:el=>tapTopic(el.dataset.id),
  revTopic:el=>{const f=findTopic(el.dataset.id),k=el.dataset.k;if(!f)return;const prev=f.x[k]||'';f.x[k]=prev===today()?'':today();save();render();toast(f.x[k]?'✓ Revised':'Marked not revised',()=>{f.x[k]=prev;save();render()})},
  vidTap:el=>{const f=findVideo(el.dataset.id);if(!f)return;const prev=f.v.w;f.v.w=prev?'':today();save();render();toast(prev?'Marked not watched':'✓ Watched',()=>{f.v.w=prev;save();render()})},
  oneMoreVid:()=>{const ex=new Set(S.plan.vids.concat(S.plan.skip||[]));const more=pickVideos(1e9,S.plan.ids,ex).filter(id=>!ex.has(id));if(!more.length){toast('No lectures left');return}S.plan.vids.push(more[0]);save();render()},
  vidImport:()=>vidImportForm(),vidPrompt:()=>vidPromptSheet(),
  clearVids:el=>armed(el,()=>{const s=sub(el.dataset.id);s.videos=[];S.plan.date='';save();render();toast('Lectures removed')},'Tap again'),
  copyPrompt:()=>{const t=$('#prompt-text').value;try{navigator.clipboard.writeText(t).then(()=>toast('Prompt copied. Paste it in Claude.'),()=>{$('#prompt-text').select();toast('Select all and copy')})}catch(e){$('#prompt-text').select();toast('Select all and copy')}},
  dropItem:el=>{const P=S.plan,id=el.dataset.id,ty=el.dataset.type,k=el.dataset.k;const snap=JSON.stringify(P);
    if(ty==='t')P.ids=P.ids.filter(x=>x!==id);else if(ty==='r')P.rev=P.rev.filter(r=>!(r.id===id&&r.k===k));else P.vids=P.vids.filter(x=>x!==id);
    P.skip=P.skip||[];if(!P.skip.includes(id))P.skip.push(id);save();render();toast('Removed from today. It will come back another day.',()=>{S.plan=JSON.parse(snap);save();render()})},
  addToday:el=>addToPlan(el.dataset.id),
  pickTopic:()=>{const subs=semSubs().filter(s=>topicsOf(s).some(x=>!x.done));if(!subs.length){toast('No topics left');return}
    sheet({title:'Choose a topic for today',submit:'Add to today',body:`<label class="f">Subject<select id="pick-sub" name="sub">${subs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label class="f">Topic<select id="pick-top" name="top">${pickOpts(subs[0].id)}</select></label>`,
      onSubmit:d=>{if(!d.top)return false;closeSheet();addToPlan(d.top);return false}})},
  oneMore:()=>{const ex=new Set(S.plan.ids.concat(S.plan.rev.map(r=>r.id),S.plan.skip||[]));const more=pickTopics(1,ex);if(more.length){S.plan.ids.push(more[0])}else{const r=extraRevisions(1,ex);if(!r.length){toast('Nothing more to add');return}S.plan.rev.push(r[0])}save();render()},
  toggleSub:el=>{const id=el.dataset.id;S.open[id]=S.open[id]!==true;save(true);render()},
  openAll:el=>{for(const s of semSubs())S.open[s.id]=el.dataset.o==='1';save(true);render()},
  filter:el=>{UI.filter=el.dataset.f;render()},
  subForm:el=>subForm(el.dataset.id),
  semForm:el=>semForm(el.dataset.id),
  semSet:el=>{S.activeSem=el.dataset.id;S.plan.date='';save();render();toast('Current semester changed')},
  addPack:()=>{const before=S.subjects.length;loadPack();S.plan.date='';save();render();toast(S.subjects.length>before?'Sem 1 subjects added back':'All Sem 1 subjects are already there')},
  reset:el=>armed(el,()=>{S=fresh();loadPack();S.set.tutDone=true;save();go('today');toast('All progress erased')},'Tap again to erase'),
  walk:()=>walk(0),walkGo:el=>walk(+el.dataset.i),walkEnd:()=>{$('#walk-root').innerHTML='';S.set.tutDone=true;save(true);go('today')},
  syncCreate:()=>{SY.code=newCode();SY.dirty=true;saveSY();setSync('Uploading…');render();push().then(render)},
  syncJoin:()=>joinCode($('#sy-join').value),
  syncNow:()=>{setSync('Syncing…');pull(true)},
  syncOff:el=>armed(el,()=>{SY.code='';SY.status='';SY.dirty=false;saveSY();render();toast('Sync turned off on this device. Cloud copy is kept.')},'Tap again to turn off'),
  copyCode:()=>{try{navigator.clipboard.writeText(SY.code).then(()=>toast('Code copied'),()=>toast('Select the code and copy it'))}catch(e){toast('Select the code and copy it')}},
  export:()=>{try{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='study-desk-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded')}catch(e){toast('Download blocked here. Use Copy backup text.')}},
  copyBk:()=>{const txt=JSON.stringify(S);const fb=()=>sheet({title:'Backup text',submit:false,body:`<div class="small">Select all and copy this text into a note or email.</div><textarea readonly style="min-height:240px">${esc(txt)}</textarea>`});try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied. Paste it into a note or email.'),fb)}catch(e){fb()}},
  pasteImp:()=>sheet({title:'Paste backup',submit:'Import',body:`<div class="small" style="color:var(--bad);font-weight:700">This replaces all data on this device.</div><label class="f">Backup text<textarea name="t" required style="min-height:200px"></textarea></label>`,onSubmit:d=>importText(d.t)}),
  sclose:(el,e)=>{if(e.target===el)closeSheet()},sclose2:()=>closeSheet(),
  sdel:el=>armed(el,()=>SH&&SH.del&&SH.del(),'Tap again to delete'),
};
function importText(t){try{let d=JSON.parse(t);if(!d||!d.subjects||!d.sems)throw 0;if(!d.plan)d=fromOld(d);S=d;migrate();save();go('today');toast('Backup imported')}catch(e){toast('That is not a valid backup');return false}}

document.addEventListener('click',e=>{
  if(e.target.closest('#toast-undo')){const f=undoFn;undoFn=null;$('#toast').hidden=true;if(f)f();return}
  const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=A[el.dataset.act];if(!a)return;
  if(el.dataset.act==='sclose'||el.dataset.act==='setTheme'){a(el,e);return}
  e.stopPropagation();a(el,e);
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='semsel'){S.activeSem=t.value;S.plan.date='';save();render()}
  else if(t.id==='brk-on'){S.set.brkOn=t.checked;save();if(t.checked&&'Notification' in window&&Notification.permission==='default'){try{Notification.requestPermission().then(()=>render())}catch(e){}}render();toast(t.checked?'Break reminders on':'Break reminders off')}
  else if(t.id==='brk-sound'){S.set.brkSound=t.checked;save();if(t.checked){unlockAudio();chime()}}
  else if(t.id==='brk-from'||t.id==='brk-to'){if(t.value){S.set[t.id==='brk-from'?'brkFrom':'brkTo']=t.value;save();toast('Saved')}}
  else if(t.id==='pick-sub'){const p=$('#pick-top');if(p)p.innerHTML=pickOpts(t.value)}
  else if(t.id==='sem-exam'){sem().exam=t.value;S.plan.date='';save();render();toast(t.value?'Exam date saved':'Exam date cleared')}
  else if(t.id==='hrs-custom'){const h=Math.min(16,Math.max(0.5,parseFloat(t.value)||0));if(!parseFloat(t.value))return;S.hoursLog[today()]=h;buildPlan(h);save();render()}
  else if(t.dataset.set){const v=parseFloat(t.value);if(isNaN(v))return;S.set[t.dataset.set]=v;S.plan.date='';save();toast('Saved')}
  else if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(BRK.open&&!BRK.walkEnd){hideBreak();return}if(!$('#focus').hidden){$('#focus').hidden=true;exitFull();wake(false);return}}if(e.key==='Escape'&&SH)closeSheet();if(e.key==='Enter'&&e.target.tagName==='LABEL'&&e.target.htmlFor==='imp')$('#imp').click()});

render();
if(!S.set.tutDone)setTimeout(()=>walk(0),300);
if(syncOn())pull();
})();
</script>
